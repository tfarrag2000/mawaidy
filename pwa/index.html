<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mawaidy/pwa/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#0E5A5A">
  <meta name="description" content="Mawaidy — Smart Clinic &amp; Queue Management">
  <meta name="google-signin-client_id" content="1074728815746-rlct3ei66sev1e0r0ar4bq1u8krfl7us.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مَوَاعِيدِي | Mawaidy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مَوَاعِيدِي | Mawaidy</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F2FBF9;
    }
    #mawaidy-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #F2FBF9;
      color: #0E5A5A;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 9999;
    }
    .mawaidy-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(14, 90, 90, 0.2);
      border-top-color: #0E5A5A;
      border-radius: 50%;
      animation: mawaidy-spin 0.8s linear infinite;
    }
    @keyframes mawaidy-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="mawaidy-splash" aria-label="Loading">
    <div style="font-size: 22px; font-weight: 700;">مَوَاعِيدِي | Mawaidy</div>
    <div class="mawaidy-spinner"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('mawaidy-splash');
      if (splash) splash.remove();
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('push_sw.js').catch(function () {});
      });
    }
  </script>
  <script src="push_bridge.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
